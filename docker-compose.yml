version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apollo_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-apollo}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/setup_postgres_constraints.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apollo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apollo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apollo_backend_prod
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apollo}
      PYTHONUNBUFFERED: 1
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - apollo-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apollo_frontend_prod
    restart: always
    ports:
      - "3000:3000"
      - "80:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FASTAPI_BACKEND_URL: http://backend:8000
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - apollo-network

volumes:
  postgres_data:

networks:
  apollo-network:
    driver: bridge
