          <h2>Our Solar Maintenance Products (SS304 Medical Grade Hardware)</h2>

          <article id="ss304-solar-panel-sprinkler">
            <h3>SS304 Solar Panel Sprinkler (Model AE-S400 / 01)</h3>
            <p><strong>Material:</strong> Medical Grade SS304 Stainless Steel (AetherWash Technology)</p>
            <p><strong>Description:</strong> India's premier shadowless solar sprinkler nozzle. Provides 180° uniform water curtain coverage (2800mm spray range) with 4-7 LPM water consumption. 30-Year rust-free guarantee.</p>
            <ul>
              <li>Shadow-Less Design – Minimizes shading on solar cells</li>
              <li>180° Cleaning – 2800mm range, uniform water spread</li>
              <li>Water Efficient – Low Water Consumption (4-7 LPM)</li>
              <li>+15–20% Output – Proven solar performance boost</li>
              <li>30-Year Warranty – Rust coverage guaranteed</li>
            </ul>
          </article>

          <article id="ss304-solar-auto-drain-clips">
            <h3>SS304 Solar Auto Drain Clips (Model AE-DC100 / 02)</h3>
            <p><strong>Material:</strong> Full SS304 Body | Tool-Free Snap-On</p>
            <p><strong>Description:</strong> Eliminates muddy water pooling and dust accumulation on solar panel bottom edges using capillary siphon action. Universal fit for 28mm to 40mm panel frames. 10-Year warranty.</p>
            <ul>
              <li>Auto Sludge Removal – Siphon drains stagnant water/mud</li>
              <li>Tool-Free Snap-On – Quick attach to bottom frame</li>
              <li>Full SS304 Body – No plastic degradation under UV</li>
              <li>5 Universal Sizes – Fits 28mm to 40mm solar frames</li>
            </ul>
          </article>

          <article id="gi-solar-pipe-clamp">

            <li>Use 1/2" UPVC or 3/4" CPVC Threaded Tee fitting.</li>
            <li>Apply Teflon tape (6-7 rounds) on nozzle threads.</li>
            <li>Mount sprinkler in middle top of solar array.</li>
            <li>Connect to submersible pump system (4-7 LPM per nozzle at 2-4 Bar).</li>
            <li>Tighten securely and test 180° spray coverage.</li>

          <h2>Frequently Asked Questions (FAQs)</h2>
          <article>
            <h3>Why should we use SS304 instead of plastic sprinklers?</h3>
            <p>Plastic degrades quickly under continuous UV exposure on solar rooftops, leading to cracks, leaks, and uneven cleaning. Our medical-grade SS304 sprinklers offer a 30-year rust-free life, handling high water pressure and extreme temperatures without fail.</p>
          </article>
          <article>
            <h3>What is the recommended water pressure for Apollo Sprinklers?</h3>
            <p>For optimal 180-degree AetherWash coverage, we recommend maintaining a water pressure between 2 to 4 Bar. This ensures a healthy flow rate of 4 to 7 Liters Per Minute (LPM) per sprinkler, efficiently washing the panels without wasting water.</p>
          </article>
          <article>
            <h3>How many Auto Drain Clips do I need per panel?</h3>
            <p>We recommend installing 2 Auto Drain Clips per solar panel on the bottom edge (lowest point) to ensure maximum capillary action and complete removal of stagnant muddy water.</p>
          </article>

            <h3>Do you supply pan-India and what is the MOQ?</h3>
