version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apollo_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apollo_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apollo_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - apollo-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apollo_backend_dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/apollo_dev
      PYTHONUNBUFFERED: 1
      ENV: development
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apollo-dev-network

  frontend:
    image: node:22-alpine
    container_name: apollo_frontend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      FASTAPI_BACKEND_URL: http://backend:8000
      PORT: 3000
    command: sh -c "npm run dev"
    depends_on:
      - backend
    networks:
      - apollo-dev-network

volumes:
  postgres_dev_data:

networks:
  apollo-dev-network:
    driver: bridge
