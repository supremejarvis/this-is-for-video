services:
  postgres_test:
    image: postgres:16-alpine
    container_name: apollo_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apollo_disposable_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apollo_disposable_test"]
      interval: 2s
      timeout: 3s
      retries: 10
